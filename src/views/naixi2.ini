; naixi - generic remote config
; for sub-web-modify / subconverter
; the converter service is responsible for generating different client formats
; this file only provides one common rule/group definition
;
; replace this placeholder before uploading:
; https://raw.githubusercontent.com/utopia0051/sub-web-modify/master/src/views
; example:
; https://raw.githubusercontent.com/<user>/<repo>/<branch>/naixi

[custom]

enable_rule_generator=true
overwrite_original_rules=true

; groups
custom_proxy_group=!!import:https://raw.githubusercontent.com/utopia0051/sub-web-modify/master/src/views/snippets/groups.txt?v=20260413b

; rules
ruleset=!!import:https://raw.githubusercontent.com/utopia0051/sub-web-modify/master/src/views/snippets/rulesets.txt?v=20260412b
